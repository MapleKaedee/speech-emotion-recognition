<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --text-primary: #fafafa;
        --text-tertiary: #a3a3a3;
        --surface-2: rgba(23, 23, 23, 0.55);
        --border-subtle: rgba(163, 163, 163, 0.14);
        --border-strong: rgba(255, 255, 255, 0.22);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: transparent;
        font-family:
          "Source Sans Pro",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      #wrap {
        padding: 2px;
      }
      #btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.6rem 1rem;
        border-radius: 10px;
        border: 1px solid var(--border-subtle);
        background: var(--surface-2);
        color: var(--text-primary);
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          border-color 150ms ease,
          background 150ms ease;
      }
      #btn:hover {
        border-color: var(--border-strong);
      }
      #btn.recording {
        background: rgba(248, 113, 113, 0.12);
        border-color: rgba(248, 113, 113, 0.4);
      }
      #btn:disabled {
        opacity: 0.55;
        cursor: default;
      }
      #status {
        margin-top: 0.4rem;
        font-size: 0.78rem;
        color: var(--text-tertiary);
        text-align: center;
        min-height: 1rem;
      }
      #status.error {
        color: #f87171;
      }
      #bar-wrap {
        margin-top: 0.4rem;
        height: 4px;
        border-radius: 999px;
        background: rgba(163, 163, 163, 0.18);
        overflow: hidden;
        display: none;
      }
      #bar-wrap.show {
        display: block;
      }
      #bar-fill {
        height: 100%;
        width: 0%;
        background: #f87171;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <button id="btn">🎙️ Rekam</button>
      <div id="bar-wrap"><div id="bar-fill"></div></div>
      <div id="status"></div>
    </div>
    <script>
      function post(type, extra) {
        window.parent.postMessage(
          Object.assign({ type: type, isStreamlitMessage: true }, extra),
          "*",
        );
      }
      function setValue(value) {
        post("streamlit:setComponentValue", { value: value, dataType: "json" });
      }
      function setFrameHeight() {
        post("streamlit:setFrameHeight", {
          height: document.documentElement.scrollHeight + 4,
        });
      }

      let args = {};
      let maxMs = 4000;
      let minMs = 400;
      let recorder = null;
      let chunks = [];
      let startTime = 0;
      let stopTimerId = null;
      let tickIntervalId = null;

      const btn = document.getElementById("btn");
      const status = document.getElementById("status");
      const barWrap = document.getElementById("bar-wrap");
      const barFill = document.getElementById("bar-fill");

      function fmt(seconds) {
        return seconds.toFixed(1);
      }

      function resetUi() {
        btn.textContent = "🎙️ Rekam";
        btn.classList.remove("recording");
        btn.disabled = false;
        barWrap.classList.remove("show");
        barFill.style.width = "0%";
      }

      function encodeWav(audioBuffer) {
        const numChannels = 1;
        const sampleRate = audioBuffer.sampleRate;
        const samples = audioBuffer.getChannelData(0);
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);
        const writeStr = (offset, str) => {
          for (let i = 0; i < str.length; i++)
            view.setUint8(offset + i, str.charCodeAt(i));
        };
        writeStr(0, "RIFF");
        view.setUint32(4, 36 + samples.length * 2, true);
        writeStr(8, "WAVE");
        writeStr(12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * numChannels * 2, true);
        view.setUint16(32, numChannels * 2, true);
        view.setUint16(34, 16, true);
        writeStr(36, "data");
        view.setUint32(40, samples.length * 2, true);
        let offset = 44;
        for (let i = 0; i < samples.length; i++, offset += 2) {
          const s = Math.max(-1, Math.min(1, samples[i]));
          view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
        }
        let binary = "";
        const bytes = new Uint8Array(buffer);
        const chunkSize = 0x8000;
        for (let i = 0; i < bytes.length; i += chunkSize) {
          binary += String.fromCharCode.apply(
            null,
            bytes.subarray(i, i + chunkSize),
          );
        }
        return "data:audio/wav;base64," + btoa(binary);
      }

      async function startRecording() {
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (err) {
          status.textContent = "Izin mikrofon ditolak atau tidak tersedia.";
          status.classList.add("error");
          return;
        }

        recorder = new MediaRecorder(stream);
        chunks = [];
        startTime = Date.now();

        recorder.ondataavailable = (e) => {
          if (e.data.size > 0) chunks.push(e.data);
        };

        recorder.onstop = async () => {
          clearTimeout(stopTimerId);
          clearInterval(tickIntervalId);
          stream.getTracks().forEach((t) => t.stop());
          const elapsed = Date.now() - startTime;
          resetUi();

          if (elapsed < minMs) {
            status.textContent = `Terlalu pendek (${fmt(elapsed / 1000)}s). Minimal ${fmt(minMs / 1000)}s — ulangi rekam.`;
            status.classList.add("error");
            setValue({ error: "too_short", duration_ms: elapsed });
            return;
          }

          status.classList.remove("error");
          status.textContent = "Memproses...";
          try {
            const blob = new Blob(chunks, { type: "audio/webm" });
            const arrayBuf = await blob.arrayBuffer();
            const audioCtx = new (
              window.AudioContext || window.webkitAudioContext
            )();
            const decoded = await audioCtx.decodeAudioData(arrayBuf);
            const wavBase64 = encodeWav(decoded);
            status.textContent = `Rekaman selesai (${fmt(elapsed / 1000)}s).`;
            setValue({
              audio_base64: wavBase64,
              duration_ms: elapsed,
              mime: "audio/wav",
            });
          } catch (err) {
            status.textContent = "Gagal memproses rekaman, coba lagi.";
            status.classList.add("error");
            setValue({ error: "processing_failed", duration_ms: elapsed });
          }
          setFrameHeight();
        };

        recorder.start();
        btn.textContent = "⏹️ Stop";
        btn.classList.add("recording");
        status.classList.remove("error");
        barWrap.classList.add("show");

        tickIntervalId = setInterval(() => {
          const elapsed = Date.now() - startTime;
          status.textContent = `Merekam... ${fmt(elapsed / 1000)}s / ${fmt(maxMs / 1000)}s`;
          barFill.style.width = Math.min(100, (elapsed / maxMs) * 100) + "%";
        }, 100);

        stopTimerId = setTimeout(() => {
          if (recorder && recorder.state === "recording") recorder.stop();
        }, maxMs);

        setFrameHeight();
      }

      btn.addEventListener("click", () => {
        if (recorder && recorder.state === "recording") {
          recorder.stop();
          return;
        }
        startRecording();
      });

      window.addEventListener("message", (event) => {
        const data = event.data;
        if (!data || data.type !== "streamlit:render") return;
        args = data.args || {};
        maxMs = Math.round((args.max_seconds || 4.0) * 1000);
        minMs = Math.round((args.min_seconds || 0.4) * 1000);
        // ponytail: JANGAN panggil setFrameHeight() di sini -- "streamlit:render"
        // dikirim ulang setiap rerun, dan melaporkan tinggi memicu Streamlit
        // merender ulang lagi, jadi loop umpan-balik tak berujung (iframe tumbuh
        // ribuan piksel per detik). Sudah dites: cukup hilangkan baris ini saja.
      });

      window.addEventListener("load", () => {
        post("streamlit:componentReady", { apiVersion: 1 });
        // rAF ganda: tunggu browser benar-benar melukis konten dulu, supaya
        // scrollHeight yang diukur bukan 0/terlalu kecil (window.load bisa fire
        // sebelum layout final selesai).
        requestAnimationFrame(() => requestAnimationFrame(setFrameHeight));
      });
    </script>
  </body>
</html>
